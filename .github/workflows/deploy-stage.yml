# SYN-05 C0.5 — Deploy STAGE with fail-closed change classification.
# Bootstrap: pipeline self-change → BOOTSTRAP_REVIEW → no auto deploy.
# DEPLOY_CANDIDATE does NOT authorize deploy until DEPLOY_SAFETY_ALLOW_CANDIDATE=1
# (release gate — separate PO authorization; default OFF).
# SEC-07: functions deploy vetoed unless sync-calendar tombstone present on tip.

name: Deploy STAGE

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: both-stage-deployment
  cancel-in-progress: false

jobs:
  classify:
    name: Classify deploy necessity
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      decision: ${{ steps.assert.outputs.decision }}
      run_db: ${{ steps.assert.outputs.run_db }}
      run_functions: ${{ steps.assert.outputs.run_functions }}
      skip_remote: ${{ steps.assert.outputs.skip_remote }}
      assert_ok: ${{ steps.assert.outputs.assert_ok }}
      reason: ${{ steps.assert.outputs.reason }}
    steps:
      # actions/checkout@v6 (immutable SHA verified 2026-11-18)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/setup-node@v7.1.0 (immutable SHA verified 2026-11-18)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect changed paths (full push range)
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "workflow_dispatch_requires_manual_path_list" > changed-paths.txt
            echo "paths_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "missing_before_sha" > changed-paths.txt
            echo "paths_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify "${BEFORE}^{commit}" >/dev/null 2>&1; then
            echo "before_sha_unresolvable" > changed-paths.txt
            echo "paths_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Triple-dot: merge-base...head covers multi-commit / merge pushes.
          git diff --name-only --diff-filter=ACDMRTUXB "${BEFORE}...${AFTER}" > changed-paths.txt
          echo "Changed paths:"
          cat changed-paths.txt
          if [ ! -s changed-paths.txt ]; then
            echo "empty_diff" > changed-paths.txt
            echo "paths_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "paths_ok=true" >> "$GITHUB_OUTPUT"

      - name: Classify
        id: classify
        env:
          PATHS_OK: ${{ steps.paths.outputs.paths_ok }}
        run: |
          set -euo pipefail
          if [ "${PATHS_OK:-false}" != "true" ]; then
            printf '%s\n' '{"decision":"UNKNOWN_BLOCKED","reasons":["path_collection_failed"],"may_skip_remote_deploy":false,"run_db":false,"run_functions":false}' > classify.json
          else
            node --experimental-strip-types scripts/deploy-safety/classify-deploy-changes.ts changed-paths.txt > classify.json
          fi
          cat classify.json

      - name: Assert decision (fail-closed)
        id: assert
        env:
          DEPLOY_EXPECTED_PROJECT_REF: qszggrrjhcwltnmxpxcy
          DEPLOY_ACTUAL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # Release gate OFF by default — DEPLOY_CANDIDATE never auto-deploys in C0.5.
          DEPLOY_SAFETY_ALLOW_CANDIDATE: ${{ vars.DEPLOY_SAFETY_ALLOW_CANDIDATE }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/deploy-safety/assert-deploy-decision.ts classify.json
          # Hard stop on INVALID / BOOTSTRAP / UNKNOWN / REVIEW (script sets exit 2/3)

      - name: SEC-07 tombstone veto (when functions candidate allowed)
        if: steps.assert.outputs.run_functions == 'true'
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/deploy-safety/classify-deploy-changes.ts --sec07-check .

  deploy:
    name: Supabase STAGE
    needs: classify
    # Only when assert explicitly set run_db or run_functions (never on SAFE_SKIP / BLOCKED / bootstrap).
    if: >
      github.ref == 'refs/heads/develop' &&
      needs.classify.outputs.assert_ok == 'true' &&
      (needs.classify.outputs.run_db == 'true' || needs.classify.outputs.run_functions == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RUN_DB: ${{ needs.classify.outputs.run_db }}
      RUN_FUNCTIONS: ${{ needs.classify.outputs.run_functions }}
      DECISION: ${{ needs.classify.outputs.decision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # supabase/setup-cli@v1 — pin immutable SHA verified 2026-11-18
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 2.115.0

      - name: Preflight credentials and target guard
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          if [ "$SUPABASE_PROJECT_REF" != "qszggrrjhcwltnmxpxcy" ]; then
            echo "ERROR: unexpected STAGE project ref"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "sknpqjodttkpttaytdut" ]; then
            echo "ERROR: legacy project deployment prohibited"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "ERROR: deploy only allowed on develop"
            exit 1
          fi
          echo "Deploy decision=$DECISION run_db=$RUN_DB run_functions=$RUN_FUNCTIONS"

      - name: Link Both STAGE
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Migration list
        if: env.RUN_DB == 'true'
        run: supabase migration list

      - name: Migration dry-run
        if: env.RUN_DB == 'true'
        run: supabase db push --dry-run

      - name: Apply migrations
        if: env.RUN_DB == 'true'
        run: supabase db push

      - name: Verify migrations
        if: env.RUN_DB == 'true'
        run: |
          set -euo pipefail
          output="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -qi 'up to date'; then
            echo "ERROR: remote database is not up to date after deploy"
            exit 1
          fi

      - name: SEC-07 tombstone veto before functions deploy
        if: env.RUN_FUNCTIONS == 'true'
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/deploy-safety/classify-deploy-changes.ts --sec07-check .

      - name: Deploy Edge Functions
        if: env.RUN_FUNCTIONS == 'true'
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: List Edge Functions
        if: env.RUN_FUNCTIONS == 'true'
        run: |
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "Local function directories:"
          find supabase/functions \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            ! -name "_shared" \
            | sort

  skip-notice:
    name: Record SAFE_SKIP / fail-closed
    needs: classify
    if: >
      always() &&
      github.ref == 'refs/heads/develop' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.run_db != 'true' &&
      needs.classify.outputs.run_functions != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notice
        run: |
          echo "No remote STAGE deploy executed."
          echo "decision=${{ needs.classify.outputs.decision }}"
          echo "reason=${{ needs.classify.outputs.reason }}"
          echo "SAFE_SKIP = watchdog/docs/deploy-safety-only."
          echo "BOOTSTRAP_REVIEW / UNKNOWN_BLOCKED / REQUIRES_REVIEW = fail-closed."
          echo "DEPLOY_CANDIDATE without release gate = blocked (DEPLOY_SAFETY_ALLOW_CANDIDATE)."
