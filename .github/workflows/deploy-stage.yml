name: Deploy STAGE

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-char commit SHA reachable from the selected branch (empty = branch HEAD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: both-stage-deployment
  cancel-in-progress: false

env:
  STAGE_PROJECT_REF: qszggrrjhcwltnmxpxcy
  STAGE_PAGES_PROJECT: both-stage

jobs:
  resolve:
    name: Resolve STAGE commit
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ERROR: sha must be a full 40-char commit id"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
            echo "ERROR: $sha is not reachable from $GITHUB_REF"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "STAGE deploy of \`$sha\` from \`$GITHUB_REF\` ($GITHUB_EVENT_NAME by $GITHUB_ACTOR)" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Supabase STAGE
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Preflight credentials and target guard
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"
          if [ "$SUPABASE_PROJECT_REF" != "$STAGE_PROJECT_REF" ]; then
            echo "ERROR: unexpected STAGE project ref"
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_REF" = "sknpqjodttkpttaytdut" ]; then
            echo "ERROR: legacy project deployment prohibited"
            exit 1
          fi

      - name: Link Both STAGE
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Migration list
        run: supabase migration list

      - name: Migration dry-run
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Verify migrations
        run: |
          set -euo pipefail
          output="$(supabase db push --dry-run 2>&1)"
          printf '%s\n' "$output"
          if ! printf '%s\n' "$output" | grep -qi 'up to date'; then
            echo "ERROR: remote database is not up to date after deploy"
            exit 1
          fi

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: List Edge Functions
        run: |
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
          echo "Local function directories:"
          find supabase/functions \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            ! -name "_shared" \
            | sort

  web:
    name: Cloudflare Pages STAGE
    needs: [resolve, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    outputs:
      origin: ${{ steps.project.outputs.origin }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: https://qszggrrjhcwltnmxpxcy.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      APP_VARIANT: preview
    steps:
      - name: Preflight Cloudflare credentials
        id: pre
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare Pages STAGE credentials not configured; web deploy skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.pre.outputs.enabled == 'true'
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.pre.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Ensure Pages project
        id: project
        if: steps.pre.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          status="$(curl -sS -o project.json -w '%{http_code}' "${auth[@]}" "$api/$STAGE_PAGES_PROJECT")"
          if [ "$status" = "404" ]; then
            curl -fsS -o project.json "${auth[@]}" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$STAGE_PAGES_PROJECT\",\"production_branch\":\"main\"}" "$api"
          elif [ "$status" != "200" ]; then
            echo "ERROR: Cloudflare Pages API returned $status"
            exit 1
          fi
          subdomain="$(jq -r '.result.subdomain' project.json)"
          rm -f project.json
          if ! printf '%s' "$subdomain" | grep -Eq '^both-stage[a-z0-9-]*\.pages\.dev$'; then
            echo "ERROR: unexpected Pages subdomain"
            exit 1
          fi
          echo "origin=https://$subdomain" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.pre.outputs.enabled == 'true'
        run: npm ci

      - name: Export web
        if: steps.pre.outputs.enabled == 'true'
        env:
          EXPO_PUBLIC_APP_URL: ${{ steps.project.outputs.origin }}
        run: |
          set -euo pipefail
          npx expo export -p web
          test -f dist/index.html
          if [ -e dist/404.html ]; then
            echo "ERROR: dist/404.html disables the Pages SPA fallback"
            exit 1
          fi

      - name: Deploy to Pages STAGE
        if: steps.pre.outputs.enabled == 'true'
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$STAGE_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$SHA" \
            --commit-message "STAGE $SHA"
          echo "Pages STAGE: ${{ steps.project.outputs.origin }} (\`$SHA\`)" >> "$GITHUB_STEP_SUMMARY"

  oauth-origins:
    name: STAGE OAuth web origin
    needs: web
    if: needs.web.outputs.origin != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ORIGIN: ${{ needs.web.outputs.origin }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Allow Pages STAGE as Edge Function OAuth redirect
        run: |
          set -euo pipefail
          want="$(printf '%s' "$ORIGIN" | sha256sum | cut -d' ' -f1)"
          have="$(supabase secrets list --project-ref "$STAGE_PROJECT_REF" -o json | jq -r '.[] | select(.name == "APP_REDIRECT_ALLOWLIST") | .value')"
          if [ -z "$have" ]; then
            supabase secrets set --project-ref "$STAGE_PROJECT_REF" "APP_REDIRECT_ALLOWLIST=$ORIGIN"
            echo "APP_REDIRECT_ALLOWLIST set to $ORIGIN"
          elif [ "$have" = "$want" ]; then
            echo "APP_REDIRECT_ALLOWLIST already $ORIGIN"
          else
            echo "ERROR: APP_REDIRECT_ALLOWLIST holds another value; refusing to overwrite"
            exit 1
          fi

      - name: Allow Pages STAGE as Supabase Auth redirect
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$STAGE_PROJECT_REF/config/auth"
          current="$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$api" | jq -r '.uri_allow_list // ""')"
          entry="$ORIGIN/**"
          if printf '%s' "$current" | tr ',' '\n' | grep -Fxq "$entry"; then
            echo "Auth redirect already allowed: $entry"
            exit 0
          fi
          next="${current:+$current,}$entry"
          curl -fsS -o /dev/null -X PATCH -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg v "$next" '{uri_allow_list: $v}')" "$api"
          echo "Auth redirect allowed: $entry"
