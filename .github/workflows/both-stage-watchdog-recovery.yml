# SYN-05 / C3-C — Recovery workflow FINAL OFF
#
# Post-supervised-essay disablement:
# - Quoted "on" + workflow_dispatch only
# - No schedule / push / pull_request / workflow_run
# - No issues:write anywhere
# - No supervised write path
# - Recovery code remains in repo but is not wired by this workflow

name: Both STAGE Watchdog Recovery

"on":
  workflow_dispatch:
    inputs:
      phase:
        description: "C3-C recovery remains OFF after live essay"
        required: true
        type: choice
        options:
          - OFF
        default: OFF
      confirm:
        description: "Ignored while OFF"
        required: true
        type: string
        default: REFUSE
      authorized_issue:
        description: "Ignored while OFF"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: both-stage-watchdog-recovery-qszggrrjhcwltnmxpxcy
  cancel-in-progress: false

jobs:
  recovery-off:
    name: Recovery OFF (refuse)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Refuse supervised recovery write
        run: |
          echo "C3-C recovery workflow is permanently OFF for this certification."
          echo "phase=${{ inputs.phase }}"
          exit 0
